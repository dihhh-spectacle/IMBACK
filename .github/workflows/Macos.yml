name: RDP-2
run-name: "RDP-1 #${{ github.run_number }} — ${{ github.event.inputs.deadline == '' && 'new session' || 'auto-continue' }}"

on:
  workflow_dispatch:
    inputs:
      deadline:
        description: "Leave empty. Used by auto-restart to keep the 24h deadline"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  secure-rdp:
    runs-on: tenki-macos-26-mini
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Set 24h Deadline
        run: |
          deadline="${{ github.event.inputs.deadline }}"

          if [ -z "$deadline" ]; then
            deadline=$(( $(date -u +%s) + 86400 ))
          fi

          echo "DEADLINE=$deadline" >> "$GITHUB_ENV"
          echo "Session deadline: $(date -u -r "$deadline") UTC"

      - name: Lighten macOS
        run: |
          # Never sleep
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 || true
          nohup caffeinate -dimsu >/dev/null 2>&1 &

          # Turn off Spotlight indexing
          sudo mdutil -a -i off || true

          # Turn off automatic software updates
          sudo softwareupdate --schedule off || true

          # Less visual junk (helps VNC speed)
          defaults write com.apple.universalaccess reduceMotion -bool true || true
          defaults write com.apple.universalaccess reduceTransparency -bool true || true
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false || true
          defaults write com.apple.dock launchanim -bool false || true
          defaults write com.apple.dock autohide-time-modifier -float 0 || true
          defaults write com.apple.dock expose-animation-duration -float 0 || true
          killall Dock || true

          echo "macOS lightened."

      - name: Enable Screen Sharing
        timeout-minutes: 3
        run: |
          # Hardcoded, max 8 chars (legacy VNC limit). Change it here if you want.
          PASS="Pr8xK2mQ"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -privs -all \
            -restart -agent \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PASS"

          # Fallback: load the screensharing daemon directly
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          echo "VNC_PASS=$PASS" >> "$GITHUB_ENV"
          echo "Screen Sharing enabled."

      - name: Verify VNC Is Listening
        run: |
          for i in $(seq 1 12); do
            if nc -z -w 5 127.0.0.1 5900; then
              echo "VNC is listening on 5900."
              exit 0
            fi
            echo "Waiting for VNC..."
            sleep 5
          done

          echo "::error::Nothing listening on port 5900."
          exit 1

      - name: Install Cloudflared and noVNC
        timeout-minutes: 10
        run: |
          brew install cloudflared websockify
          git clone --depth 1 https://github.com/novnc/noVNC.git "$HOME/noVNC"
          echo "Installed."

      - name: Start noVNC and Cloudflare Tunnel
        timeout-minutes: 5
        run: |
          # Browser <-> VNC bridge
          nohup websockify --web "$HOME/noVNC" 6080 127.0.0.1:5900 > "$HOME/websockify.log" 2>&1 &
          sleep 3

          # Cloudflare quick tunnel (no account or token needed)
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > "$HOME/cloudflared.log" 2>&1 &

          url=""
          for i in $(seq 1 30); do
            url=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' "$HOME/cloudflared.log" | head -n 1 || true)
            if [ -n "$url" ]; then
              break
            fi
            echo "Waiting for tunnel URL..."
            sleep 2
          done

          if [ -z "$url" ]; then
            echo "::error::Cloudflare tunnel URL not found."
            cat "$HOME/cloudflared.log"
            exit 1
          fi

          echo "TUNNEL_URL=$url" >> "$GITHUB_ENV"
          echo "Tunnel is up: $url"

      - name: Show Access Information
        run: |
          echo ""
          echo "=========================================="
          echo " JUST OPEN THIS LINK"
          echo "=========================================="
          echo "$TUNNEL_URL/vnc.html?autoconnect=true&password=$VNC_PASS"
          echo "=========================================="

      - name: Maintain Connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$DEADLINE
          now=$(date -u +%s)

          # Start the next runner at ~5h10m, then stay alive ~25 more minutes
          handoverAt=$(( now + 310 * 60 ))
          endAt=$(( now + 335 * 60 ))

          # Phase 1: keep the session alive
          while [ "$(date -u +%s)" -lt "$handoverAt" ] && [ "$(date -u +%s)" -lt "$deadline" ]; do
            pgrep -f websockify >/dev/null || \
              nohup websockify --web "$HOME/noVNC" 6080 127.0.0.1:5900 >> "$HOME/websockify.log" 2>&1 &
            echo "[$(date)] Active - $TUNNEL_URL/vnc.html?autoconnect=true&password=$VNC_PASS"
            sleep 300
          done

          now=$(date -u +%s)

          if [ "$now" -ge $(( deadline - 600 )) ]; then
            echo "24h deadline reached. Not starting a new runner."
            exit 0
          fi

          # Phase 2: start the next runner
          echo "Starting next runner..."

          command -v gh >/dev/null 2>&1 || brew install gh

          if gh workflow run "RDP-1" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f deadline="$deadline"; then
            echo "Next runner started. Check the Actions tab for the new link."
          else
            echo "Failed to start next runner."
          fi

          # Phase 3: overlap so you have time to switch over
          while [ "$(date -u +%s)" -lt "$endAt" ] && [ "$(date -u +%s)" -lt "$deadline" ]; do
            echo "[$(date)] Handover - this runner is about to end"
            sleep 60
          done
